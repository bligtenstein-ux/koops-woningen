# Bouwt woningen.verhuurmetkoops.nl elk uur opnieuw uit het aanbod op koopsmakelaardij.nl.
name: Huuraanbod bijwerken
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ook publiceren als er ineens 0 actieve woningen zijn (alleen als dat klopt)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['src/**', 'config/**', '.github/workflows/huur.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: huur
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: huur
      FORCE: ${{ inputs.force && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fotocache herstellen
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-huur-${{ github.run_id }}
          restore-keys: img-huur-
      - name: Aanbod ophalen en site bouwen
        run: node src/run.mjs
      - name: Archief bewaren
        run: |
          git config user.name "koops-woningen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Archief huur bijgewerkt" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/huur
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
